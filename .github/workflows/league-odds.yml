name: Live odds

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-odds
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install httpx "mcp[cli]<2"

      - name: Refresh odds and trade calculator data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: "665726760"
          ESPN_TEAM_ID: "8"
          ESPN_SEASON: "2027"
        run: python scripts/live.py

      - name: Publish
        run: |
          git config user.name "league-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/model.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update live odds"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
