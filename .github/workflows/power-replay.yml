name: Rebuild power rankings

on:
  push:
    paths: ["scripts/replay.py", ".github/workflows/power-replay.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-odds
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ESPN_S2: ${{ secrets.ESPN_S2 }}
  ESPN_SWID: ${{ secrets.ESPN_SWID }}
  ESPN_LEAGUE_ID: "665726760"
  ESPN_TEAM_ID: "8"
  ESPN_SEASON: "2027"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx "mcp[cli]<2"
      - run: python scripts/replay.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/power_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild power rankings from opening night"
          git pull --rebase && git push
