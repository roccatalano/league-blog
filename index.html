<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Fantasy 2026 Blog</title>
<meta name="description" content="Daily posts, trade reviews and weekly roundups for the NBA FANTASY 2026 league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #16181d; --muted: #5d6270; --line: #e3e0d8;
    --accent: #e8590c; --accent-soft: #fdebe0; --head: #121826; --head-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --ink: #eceef2; --muted: #9aa1ae; --line: #262c37;
            --accent: #ff7a2f; --accent-soft: #2b1d14; --head: #0a0d12; --head-ink: #ffffff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 Inter, system-ui, -apple-system, sans-serif; }
  header { background: var(--head); color: var(--head-ink); padding: 28px 16px 24px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  header a { color: inherit; text-decoration: none; }
  .brand { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 38px);
           letter-spacing: -0.5px; line-height: 1.1; }
  .brand span { color: var(--accent); }
  .tag { color: #b8bfcc; font-size: 14px; margin-top: 6px; }
  main { padding: 24px 0 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; display: block; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11px;
          text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 99px; }
  .card h2 { margin: 6px 0 4px; font-size: 20px; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  article h1 { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 34px);
               line-height: 1.15; margin: 8px 0 16px; }
  article h2 { font-size: 20px; margin: 28px 0 8px; }
  article a { color: var(--accent); }
  article table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
  article ul, article ol { padding-left: 22px; }
  article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  .back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .empty { color: var(--muted); }
  nav { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  nav a { color: #cfd5e0; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px;
          border-radius: 99px; border: 1px solid #2c3446; }
  nav a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .updated { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .mu-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .mu-team { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .mu-team.r { text-align: right; }
  .mu-score { font-family: "Archivo Black", Inter, sans-serif; font-size: 22px; text-align: center; white-space: nowrap; }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin: 10px 0 4px; background: var(--line); }
  .bar i { display: block; background: var(--accent); }
  .bar b { display: block; background: #4c6ef5; opacity: .75; }
  .mu-odds { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .mu-odds strong { color: var(--ink); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
  .cats { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  .cats td, .cats th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  .cats th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .cats td:first-child, .cats th:first-child { text-align: left; font-weight: 600; }
  .win { font-weight: 700; }
  .calc label.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0; }
  .calc select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); }
  .plist { margin-top: 10px; display: grid; gap: 4px; }
  .plist label { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 6px 4px; border-radius: 8px; }
  .plist label:hover { background: var(--accent-soft); }
  .plist small { color: var(--muted); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .res .big { font-family: "Archivo Black", Inter, sans-serif; font-size: 28px; }
  .pos { color: #2f9e44; } .neg { color: #e03131; }
  .note { font-size: 13px; color: var(--muted); }
  .ladder { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ladder th { color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  .ladder td { padding: 9px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ladder th:nth-child(2), .ladder td:nth-child(2) { text-align: left; white-space: normal; }
  .ladder th:first-child, .ladder td:first-child { text-align: left; color: var(--muted); width: 22px; }
  .ladder tr.cut td { border-bottom: 2px dashed var(--accent); }
  .ladder .tm { font-weight: 700; }
  .ladder small { color: var(--muted); display: block; font-size: 12px; }
  .up { color: #2f9e44; font-size: 12px; } .down { color: #e03131; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .dg { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .dg:last-child { border-bottom: 0; }
  .dg .rk { color: var(--muted); font-size: 13px; }
  .dg .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .dg .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .dg .score { font-family: "Archivo Black", Inter, sans-serif; font-size: 24px; min-width: 44px; text-align: right; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .chip.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .explain h3 { font-size: 16px; margin: 16px 0 4px; }
  .explain p, .explain li { font-size: 14.5px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters select { flex: 1; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; font: inherit; font-size: 13.5px; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 7px 6px; border-radius: 99px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .inj { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .inj:last-child { border-bottom: 0; }
  .inj .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .inj .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .inj .ret { text-align: right; white-space: nowrap; }
  .inj .ret b { display: block; font-family: "Archivo Black", Inter, sans-serif; font-size: 18px; font-weight: 400; }
  .inj .ret small { color: var(--muted); font-size: 12px; }
  .inj .nt { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .ladder.pk { font-size: 12.5px; } .ld .ladder.pk td, .ld .ladder.pk th { padding-left: 3px; padding-right: 3px; } .ladder.pk th { font-size: 10px; letter-spacing: 0; } .ladder.pk td:nth-child(2) { white-space: normal; min-width: 110px; } .ladder.pk th.srt { cursor: pointer; } .ladder.pk th.on { color: var(--accent); } .ladder.pk td.on { font-weight: 700; }
  .ladder .pos { color: #2f9e44; } .ladder .neg { color: #e03131; }
  .seg.pks button { font-size: 12px; padding: 5px 4px; }
  /* stat ranks heat map */
  .seg.sm { margin: 0; padding: 2px; flex: 0 0 auto; } .seg.sm button { font-size: 11.5px; padding: 3px 10px; flex: 0 0 auto; }
  .hm-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; }
  .hm-h small { color: var(--muted); font-size: 12px; }
  .hm-card { padding: 14px 8px; }
  .hm { border-collapse: separate; border-spacing: 1.5px; font-size: 12px; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
  .hm th { font-size: 9px; color: var(--muted); font-weight: 700; padding: 2px 0 4px; cursor: pointer; text-align: center; letter-spacing: 0; white-space: nowrap; }
  .hm th.on { color: var(--accent); }
  .hm td.hm-t, .hm th.hm-t { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; font-weight: 700; font-size: 10.5px; line-height: 1.15; width: 72px; padding-right: 3px; cursor: default; overflow-wrap: anywhere; }
  .hm td.hm-t span { display: none; }
  .hm tr.me td.hm-t { color: var(--accent); }
  .hm td.hm-c { text-align: center; border-radius: 6px; height: 30px; font-weight: 700; cursor: pointer; font-size: 11px; padding: 0; }
  .hm td.hm-c.pick { outline: 2px solid var(--ink); }
  .hm td.hm-avg { text-align: center; font-weight: 700; font-size: 10.5px; color: var(--muted); padding: 0; }
  .hm td.hm-avg.on { color: var(--accent); }
  .hm-pick { font-size: 13px; margin: 10px 2px 0; } .hm-pick.muted { color: var(--muted); font-size: 12px; }
  .hm-key { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin: 8px 2px 0; flex-wrap: wrap; }
  .hm-key i { width: 90px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, hsla(140,70%,45%,.6), hsla(70,70%,45%,.16), hsla(0,70%,45%,.6)); }
  .hm-key small { margin-left: auto; }
  .gb { display: grid; grid-template-columns: 118px 1fr 36px; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
  .gb-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .gb.me .gb-t { color: var(--accent); }
  .gb-b { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; } .gb-b i { display: block; height: 100%; background: var(--accent); border-radius: 4px; min-width: 3px; }
  .gb-v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  /* trade calculator */
  .tc { padding-bottom: 90px; }
  .tc-teams { display: grid; grid-template-columns: 1fr 22px 1fr; gap: 6px; align-items: center; margin-bottom: 10px; }
  .tc-teams span { text-align: center; color: var(--accent); font-weight: 800; }
  .tc-teams select { width: 100%; min-width: 0; font: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .tc-deal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; padding: 12px 14px; }
  .tc-deal small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .tc-deal b { font-size: 13.5px; line-height: 1.3; display: block; margin-top: 2px; }
  .tc-clear { position: absolute; top: 8px; right: 10px; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .tc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tc-chip { font: inherit; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; cursor: pointer; position: relative; min-height: 50px; }
  .tc-chip b { display: block; font-size: 13px; line-height: 1.2; padding-right: 4px; }
  .tc-chip small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tc-chip em { font-style: normal; font-size: 9.5px; font-weight: 800; letter-spacing: .3px; display: inline-block; margin-top: 4px; padding: 1px 6px; border-radius: 99px; }
  .tc-chip em.out, .ij-s.out { background: #ffe3e3; color: #c92a2a; } .tc-chip em.dtd, .ij-s.dtd { background: #fff3bf; color: #a66a00; }
  .tc-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; } .tc-chip.on small { color: rgba(255,255,255,.85); }
  .tc-bar-wrap { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
  .tc-res { pointer-events: auto; max-width: 696px; margin: 0 auto; background: var(--head); color: #fff; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); min-height: 34px; }
  .tc-hint { font-size: 13.5px; font-weight: 600; opacity: .85; margin: 0 auto; text-align: center; }
  .tc-side small { display: block; font-size: 11px; opacity: .7; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-side b { font-family: "Archivo Black", Inter, sans-serif; font-size: 22px; } .tc-side.r { text-align: right; }
  .tc-side b.pos { color: #69db7c; } .tc-side b.neg { color: #ff8787; }
  .tc-verdict { text-align: center; font-size: 13px; line-height: 1.25; } .tc-verdict small { display: block; font-size: 10.5px; opacity: .6; }
  .tc-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .tc-row { display: grid; grid-template-columns: 62px 1fr 38px 1fr 62px; align-items: center; gap: 4px; font-size: 12px; padding: 3px 0; }
  .tc-row b { text-align: center; font-size: 11px; } .tc-row .v { font-variant-numeric: tabular-nums; font-weight: 600; } .tc-row .v:last-child { text-align: right; }
  .tc-dv { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
  .tc-dv::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
  .tc-dv i { position: absolute; top: 0; height: 100%; border-radius: 4px; background: var(--muted); } .tc-dv i.pos { background: #40c057; } .tc-dv i.neg { background: #fa5252; }
  .tc-det .pos { color: #2f9e44; } .tc-det .neg { color: #e03131; }
  /* injuries */
  .ij-card { padding: 4px 14px; }
  .ij { border-bottom: 1px solid var(--line); } .ij:last-child { border-bottom: 0; }
  .ij summary { list-style: none; display: grid; grid-template-columns: 1fr auto 64px; gap: 10px; align-items: center; padding: 10px 0; cursor: pointer; }
  .ij summary::-webkit-details-marker { display: none; }
  .ij-n b { display: block; font-size: 14.5px; } .ij-n small { color: var(--muted); font-size: 12px; }
  .ij-n em.ir { font-style: normal; font-size: 9.5px; font-weight: 800; background: var(--line); color: var(--muted); border-radius: 4px; padding: 1px 4px; vertical-align: 2px; }
  .ij-s { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; }
  .ij-r { text-align: right; } .ij-r b { display: block; font-size: 13.5px; } .ij-r small { color: var(--muted); font-size: 11px; }
  .ij-x { font-size: 13px; color: var(--muted); padding: 0 0 12px; line-height: 1.45; }
  .ij[open] summary .ij-n b { color: var(--accent); }
  .ij-strip { padding: 14px; }
  .sb { font: inherit; width: 100%; display: grid; grid-template-columns: 122px 1fr 34px; gap: 8px; align-items: center; background: none; border: 0; color: var(--ink); padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; text-align: left; }
  .sb.on { background: var(--accent-soft); } .sb.me .sb-t { color: var(--accent); }
  .sb-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .sb-b { display: flex; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; } .sb-b i.o { background: #fa5252; } .sb-b i.q { background: #fcc419; }
  .sb-v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; } .sb-v small { color: var(--muted); font-weight: 600; font-size: 10.5px; }
  @media (prefers-color-scheme: dark) { .tc-chip em.out, .ij-s.out { background: #4a1c1c; color: #ff8787; } .tc-chip em.dtd, .ij-s.dtd { background: #4a3b10; color: #ffd43b; } }
  .grp { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
  .chip.out { background: #fde2e2; color: #c92a2a; } .chip.dtd { background: #fff3bf; color: #946200; } .chip.ft { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  @media (prefers-color-scheme: dark) { .chip.out { background: #3b1717; color: #ff8787; } .chip.dtd { background: #3a2f0b; color: #ffd43b; } }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-family: "Archivo Black", Inter, sans-serif; font-size: 24px; font-weight: 400; line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--muted); line-height: 1.3; display: block; margin-top: 4px; }
  .cal { display: grid; grid-template-columns: 64px 1fr 74px; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; }
  .cal .track { position: relative; height: 10px; background: var(--line); border-radius: 99px; }
  .cal .act { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .cal .pred { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
  .mrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mrow:last-child { border-bottom: 0; }
  .mrow small { color: var(--muted); display: block; font-size: 12px; }
  .cats.bl td:last-child, .cats.bl th:last-child { text-align: left; }
  .ok { color: #2f9e44; font-weight: 700; } .miss { color: #e03131; font-weight: 700; }
  @media (max-width: 420px) { .kpi b { font-size: 20px; } }
  /* ---- model record ---- */
  .rc { padding-top: 0; }
  main.wrap { padding-top: 24px; }
  .cats a { color: var(--accent); }
  .rc section { margin-bottom: 26px; }
  .rc-chart { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 12px 16px; margin-bottom: 12px; }
  .rc-cols { position: relative; height: 150px; display: flex; gap: 10px; padding-left: 4px; padding-right: 74px; margin-bottom: 44px; }
  .rc-col { flex: 1; max-width: 64px; display: flex; flex-direction: column; position: relative; }
  .rc-plot { position: relative; flex: 1; }
  .rc-b { position: absolute; left: 12%; right: 12%; border-radius: 5px; animation: rcGrow .6s cubic-bezier(.2,.8,.2,1) both; }
  .rc-b.up { background: #2f9e44; } .rc-b.dn { background: #e03131; }
  .rc-b em { position: absolute; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .rc-b.up em { bottom: 100%; margin-bottom: 3px; color: #2f9e44; } .rc-b.dn em { top: 100%; margin-top: 3px; color: #e03131; }
  @keyframes rcGrow { from { transform: scaleY(0); } }
  .rc-b.up { transform-origin: bottom; } .rc-b.dn { transform-origin: top; }
  .rc-x { position: absolute; left: 0; right: 0; top: 100%; margin-top: 24px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .rc-zero, .rc-avg { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
  .rc-cols .rc-zero, .rc-cols .rc-avg { bottom: auto; }
  .rc-zero { border-top: 1.5px solid var(--ink); opacity: .55; margin-top: -1px; }

<body>
<header><div class="wrap">
  <a href="#"><div class="brand">NBA FANTASY <span>2026</span></div></a>
  <div class="tag">Daily posts, trade reviews and weekly roundups. Updated automatically.</div>
  <nav><a href="#/" data-n="posts">Posts</a><a href="#/ladder" data-n="ladder">Ladder</a><a href="#/odds" data-n="odds">Live matchups</a><a href="#/trade" data-n="trade">Trade calculator</a><a href="#/stats" data-n="stats">Stat ranks</a><a href="#/injuries" data-n="injuries">Injuries</a><a href="#/trades" data-n="trades">Moves</a><a href="#/record" data-n="record">Model record</a></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<footer>Odds and expected wins come from a model, not a crystal ball.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="model.js"></script>
<script>
const app = document.getElementById("app");
const KIND = { daily: "Daily", weekly: "Weekly roundup", trade: "Trade review", draft: "Draft review" };
let posts = [];

function niceDate(d) {
  const dt = new Date(d + "T12:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function meta(p) { return `<div class="meta"><span class="pill">${esc(KIND[p.kind] || p.kind)}</span><span>${esc(niceDate(p.date))}</span></div>`; }

function home() {
  document.title = "NBA Fantasy 2026 Blog";
  if (!posts.length) { app.innerHTML = '<p class="empty">No posts yet.</p>'; return; }
  app.innerHTML = posts.map(p => `<a class="card" href="#/${encodeURIComponent(p.slug)}">${meta(p)}<h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p></a>`).join("");
}

async function show(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) { home(); return; }
  app.innerHTML = '<p class="empty">Loading…</p>';
  try {
    let md = await (await fetch(`posts/${encodeURIComponent(slug)}.md`, { cache: "no-cache" })).text();
    md = md.replace(/^---[\s\S]*?\n---\s*/, "");
    document.title = p.title + " · NBA Fantasy 2026";
    app.innerHTML = `<a class="back" href="#">← All posts</a><article>${meta(p)}<h1>${esc(p.title)}</h1>${DOMPurify.sanitize(marked.parse(md))}</article>`;
    window.scrollTo(0, 0);
  } catch (e) { app.innerHTML = '<p class="empty">Couldn\'t load that post.</p>'; }
}

function setNav(n) { document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.n === n)); }
const pct = x => (x > 0 ? "+" : "") + (100 * x).toFixed(1) + " pts";
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
}

const short = n => n.replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/)[0].slice(0, 9);
let OH = null, ODDS_WEEK = null;
const ET_FMT = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });

function wpChart(pts, home, away, final) {

  const W = 600, H = 150, X = d => (d - mon) / 7 * W, Y = v => (1 - v / 100) * H;
  let P = pts.map(p => ({ x: X(etDay(p[0])), v: p[1] + p[2] / 2, t: p[0], s: [p[3], p[4]] }));
  if (P[0].x > 2) P.unshift({ x: 0, v: P[0].v, t: null, s: [0, 0] });
  if (final) P.push({ x: W, v: final.v, t: "final", s: final.s });
  const line = P.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const area = `${line} L${P[P.length - 1].x.toFixed(1)} ${Y(50)} L0 ${Y(50)} Z`;
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const days = ["M", "T", "W", "T", "F", "S", "S"].map((l, i) => `<line x1="${X(mon + i)}" x2="${X(mon + i)}" y1="0" y2="${H}" class="wp-grid"/><text x="${X(mon + i + 0.5)}" y="${H + 14}" class="wp-day">${l}</text>`).join("");

  return `<div class="wp" data-p="${data}" data-h="${esc(home)}" data-a="${esc(away)}">
    <div class="wp-lbl top">${esc(home)}</div>
    <div class="wp-plot"><svg viewBox="0 -2 ${W} ${H + 22}" preserveAspectRatio="none">
      <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${Y(50)}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${Y(50)}" width="${W}" height="${H}"/></clipPath></defs>
      ${days}<line x1="0" x2="${W}" y1="${Y(50)}" y2="${Y(50)}" class="wp-mid"/>
      <path d="${area}" class="wp-fh" clip-path="url(#${id}a)"/><path d="${area}" class="wp-fa" clip-path="url(#${id}b)"/>
      <path d="${line}" class="wp-line" vector-effect="non-scaling-stroke"/>

    </svg>
    <span class="wp-dot${last.v < 50 ? " a" : ""}" style="left:${last.x / W * 100}%;top:${(Y(last.v) + 2) / (H + 22) * 100}%"></span></div>
    <div class="wp-lbl bot">${esc(away)}</div>
    <div class="wp-tip"></div></div>`;
}
function wireCharts() {
  app.querySelectorAll(".wp").forEach(el => {
    const P = JSON.parse(el.dataset.p), svg = el.querySelector("svg"), cur = el.querySelector(".wp-cur"), tip = el.querySelector(".wp-tip");
    const show = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 600;
      const p = P.reduce((a, b) => Math.abs(b[0] - x) < Math.abs(a[0] - x) ? b : a);
      cur.setAttribute("x1", p[0]); cur.setAttribute("x2", p[0]); cur.style.display = "";
      const who = p[1] >= 50 ? el.dataset.h : el.dataset.a, pct = p[1] >= 50 ? p[1] : 100 - p[1];
      const when = p[2] === "final" ? "Final" : p[2] ? new Date(p[2]).toLocaleString("en-AU", { weekday: "short", hour: "numeric", minute: "2-digit" }) : "Start";
      tip.innerHTML = `<b>${esc(who)} ${p[2] === "final" ? "won" : pct + "%"}</b> · ${when}${p[3] && (p[3][0] || p[3][1]) ? ` · ${p[3][0]}-${p[3][1]}` : ""}`;
      tip.style.left = Math.min(Math.max(p[0] / 6, 18), 82) + "%"; tip.style.opacity = 1;
    };
    el.addEventListener("pointermove", show); el.addEventListener("pointerdown", show);
    el.addEventListener("pointerleave", () => { cur.style.display = "none"; tip.style.opacity = 0; });
  });
}

let LAD = null, LAD_SORT = "ladder", LAD_OPEN = null, PH = null, LAD_HL = null;

const CATS = ["PTS", "REB", "AST", "STL", "BLK", "3PM", "TO", "FG%", "FT%"];
const TEAM_COLORS = ["#e8590c", "#4c6ef5", "#2f9e44", "#ae3ec9", "#f59f00", "#1098ad", "#e03131", "#5c7cfa", "#74b816", "#d6336c", "#845ef7", "#0ca678", "#fd7e14", "#868e96"];
function rankChart(days, teams, hl, f = null) {
  if (!days || days.length < 2) return `<div class="card"><p class="note" style="margin:0"><b>Power rank by day</b> · the chart starts today and adds a point each day, so check back tomorrow.</p></div>`;
  const N = days.length, full = f == null; f = full ? N - 1 : Math.max(0, Math.min(N - 1, f));
  const n = teams.length, W = 600, H = 240;
  const X = i => i / (N - 1) * W, Y = r => (r - 1) / (n - 1) * H;
  const color = t => TEAM_COLORS[teams.indexOf(t) % TEAM_COLORS.length];

  const ease = x => x * x * (3 - 2 * x);

    const pts = [];
    for (let i = 0; i <= i0; i++) if (days[i].ranks[t]) pts.push([X(i), Y(days[i].ranks[t])]);
    if (fr > 0 && rAt(t) != null) pts.push([X(f), Y(rAt(t))]);
    if (!pts.length) return "";
    const on = !hl || hl === t;
    return `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}" fill="none" stroke="${color(t)}" stroke-width="${hl === t ? 3.2 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${on ? 1 : 0.15}" vector-effect="non-scaling-stroke"/>`;
  }).join("");
  const cur = days[Math.round(f)];
  const labels = teams.filter(t => rAt(t) != null).map(t => `<span class="rk-lbl${hl && hl !== t ? " off" : ""}" data-t="${esc(t)}" style="top:${Y(rAt(t)) / H * 100}%;color:${color(t)}">${cur.ranks[t] ?? ""} ${esc(short(t))}</span>`).join("");
  const ticks = [1, 4, 7, 10, 14].filter(r => r <= n).map(r => `<span class="rk-y" style="top:${Y(r) / H * 100}%">${r}</span>`).join("");
  const grid = [1, 4, 7, 10, 14].filter(r => r <= n).map(r => `<line x1="0" x2="${W}" y1="${Y(r)}" y2="${Y(r)}" class="wp-grid" vector-effect="non-scaling-stroke"/>`).join("");

  const cursor = full ? "" : `<line x1="${X(f)}" x2="${X(f)}" y1="-6" y2="${H + 6}" stroke="var(--muted)" stroke-width="1" opacity=".5" vector-effect="non-scaling-stroke"/>`;
  const playing = !!RK_PLAY.raf;
  const btn = `<button type="button" class="rk-play" aria-label="${playing ? "Pause" : "Play"}">${playing ? "❚❚ Pause" : full ? "▶ Play" : "▶ Resume"}</button>`;
  return `<div class="card rk"><div class="rk-h"><b>Power rank by day</b>${btn}</div>

    <div class="tc-dates" style="margin:6px 96px 0 22px"><span>${day(days[0].date)}</span><span>${day(days[N - 1].date)}</span></div>
    ${days.some(x => x.rebuilt) ? `<p class="note" style="margin:8px 0 0">Up to ${day(days.filter(x => x.rebuilt).slice(-1)[0].date)} the ranks were rebuilt by replaying the season day by day, with only what the model could have known each morning.</p>` : ""}</div>`;
}
// play button: animate the chart from opening night to today
const RK_PLAY = { f: null, raf: 0 };
const RK_MS_PER_DAY = 700;
function rkRedraw() {
  const el = app.querySelector(".card.rk"); if (!el) { cancelAnimationFrame(RK_PLAY.raf); RK_PLAY.raf = 0; return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = rankChart(PH.days, LAD.ladder.map(r => r.team).sort(), LAD_HL, RK_PLAY.f);
  for (const sel of [".rk-sub", ".rk-wrap"]) el.querySelector(sel).innerHTML = tmp.querySelector(sel).innerHTML;
  const b = el.querySelector(".rk-play"), nb = tmp.querySelector(".rk-play");
  if (b.textContent !== nb.textContent) { b.textContent = nb.textContent; b.setAttribute("aria-label", nb.getAttribute("aria-label")); }
  el.querySelectorAll(".rk-lbl").forEach(x => x.onclick = () => { LAD_HL = LAD_HL === x.dataset.t ? null : x.dataset.t; rkRedraw(); });
}
function rkWire() {
  const b = app.querySelector(".rk-play"); if (b) b.onclick = rkToggle;
  app.querySelectorAll(".rk-lbl").forEach(el => el.onclick = () => { LAD_HL = LAD_HL === el.dataset.t ? null : el.dataset.t; rkRedraw(); });
}
function rkToggle() {
  if (RK_PLAY.raf) { cancelAnimationFrame(RK_PLAY.raf); RK_PLAY.raf = 0; rkRedraw(); return; }
  const N = PH.days.length;
  if (RK_PLAY.f == null || RK_PLAY.f >= N - 1) RK_PLAY.f = 0;
  let t0 = null, f0 = RK_PLAY.f;
  const step = ts => {
    if (t0 == null) t0 = ts;
    RK_PLAY.f = f0 + (ts - t0) / RK_MS_PER_DAY;
    if (RK_PLAY.f >= N - 1) { RK_PLAY.f = null; RK_PLAY.raf = 0; rkRedraw(); return; }
    RK_PLAY.raf = requestAnimationFrame(step);
    rkRedraw();
  };
  RK_PLAY.raf = requestAnimationFrame(step);
}

  const S = STATS, MODES = { total: "Total", matchup: "Per matchup", day: "Per day", game: "Per game" }, mode = STAT_MODE;
  if (!S.days_done) { app.innerHTML = '<p class="empty">Stat ranks appear after the next data refresh.</p>'; return; }
  const cats = S.categories.map(c => c.cat), teams = [...new Set(S.categories[0].rows.map(r => r.team))];
  const n = teams.length, val = {}, rank = {};
  S.categories.forEach(c => {
    const rows = c.rows.filter(r => r[mode] != null).sort((a, b) => c.cat === "TO" ? a[mode] - b[mode] : b[mode] - a[mode]);
    rows.forEach((r, i) => { (val[r.team] ||= {})[c.cat] = r[mode]; (rank[r.team] ||= {})[c.cat] = i + 1; });
  });
  const avg = t => { const v = cats.map(c => rank[t]?.[c]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 99; };
  const sorted = teams.slice().sort((a, b) => STAT_SORT === "avg" ? avg(a) - avg(b) : (rank[a]?.[STAT_SORT] ?? 99) - (rank[b]?.[STAT_SORT] ?? 99));
  const fmt = (c, v) => v == null ? "–" : c.includes("%") ? v.toFixed(3).replace(/^0/, "") : v >= 100 ? Math.round(v) : v.toFixed(mode === "game" || mode === "day" ? 1 : 0);
  const th = [...cats, "avg"].map(c => `<th class="srt${c === STAT_SORT ? " on" : ""}" data-c="${c}">${c === "avg" ? "Avg" : c}</th>`).join("");
  const body = sorted.map((t, i) => `<tr class="${t === MY_TEAM ? "me" : ""}"><td class="hm-t"><span>${i + 1}</span>${esc(t)}</td>${cats.map(c => {
      const k = rank[t]?.[c], pick = STAT_PICK === t + "|" + c;
      return `<td class="hm-c${pick ? " pick" : ""}${c === STAT_SORT ? " on" : ""}" data-p="${esc(t)}|${c}" style="background:${k ? heat(k, n) : "transparent"}">${STAT_SHOW === "rank" && !pick ? (k ?? "–") : fmt(c, val[t]?.[c])}</td>`; }).join("")}
    <td class="hm-avg${STAT_SORT === "avg" ? " on" : ""}">${avg(t).toFixed(1)}</td></tr>`).join("");
  // what stands out for each team: best and worst categories
  const pickInfo = STAT_PICK ? (() => { const [t, c] = STAT_PICK.split("|"); return `<div class="hm-pick"><b>${esc(t)}</b> · ${c}: <b>${fmt(c, val[t]?.[c])}</b> ${MODES[mode].toLowerCase()}, ranked ${rank[t]?.[c]} of ${n}${c === "TO" ? " (fewest = 1st)" : ""}</div>`; })() : `<div class="hm-pick muted">Tap a cell to see the number behind it.</div>`;
  const g = [...S.games].sort((a, b) => (b.per_day ?? -1) - (a.per_day ?? -1)), gmax = g[0]?.per_day || 1, gmin = Math.min(...g.map(x => x.per_day ?? gmax)) * 0.9;
  const bars = g.map(r => `<div class="gb${r.team === MY_TEAM ? " me" : ""}"><span class="gb-t">${esc(r.team)}</span><span class="gb-b"><i style="width:${((r.per_day - gmin) / (gmax - gmin) * 100).toFixed(1)}%"></i></span><span class="gb-v">${r.per_day.toFixed(2)}</span></div>`).join("");
  const seg = `<div class="seg">${Object.entries(MODES).map(([k, v]) => `<button type="button" data-m="${k}" class="${k === mode ? "on" : ""}">${v}</button>`).join("")}</div>`;
  const show = `<div class="seg sm">${[["rank", "Ranks"], ["value", "Values"]].map(([k, v]) => `<button type="button" data-s="${k}" class="${k === STAT_SHOW ? "on" : ""}">${v}</button>`).join("")}</div>`;
  const basis = mode === "matchup" ? `${S.weeks_done} finished matchup${S.weeks_done === 1 ? "" : "s"}` : `${S.days_done} finished days`;
  app.innerHTML = `${seg}<div class="card hm-card"><div class="hm-h"><b>Category ranks</b>${show}</div>
    <div class="scroll"><table class="hm">${`<tr><th class="hm-t">Team</th>${th}</tr>`}${body}</table></div>${pickInfo}
    <div class="hm-key"><span>1st</span><i></i><span>${n}th</span><small>Tap a heading to sort · Avg = average rank</small></div></div>
    <div class="card"><div class="hm-h"><b>Games played</b><small>starts per day</small></div>${bars}
      <p class="note" style="margin:8px 0 0">Starters' games only, over ${S.days_done} finished days. More games usually means more streaming.</p></div>
    <details class="rc-how"><summary>How it's measured</summary><div class="explain">
      <p>Based on ${basis}. <strong>Per game</strong> spreads totals over the games starters actually played, so it rewards player quality, not streaming volume. ${mode === "matchup" ? "FG% and FT% are the average of each week's percentage." : "FG% and FT% are season makes ÷ attempts."} TO is ranked fewest first.</p></div></details>
    <p class="updated">Updated ${esc(ago(S.updated_utc))}.</p>`;
  app.querySelectorAll(".seg button[data-m]").forEach(b => b.onclick = () => { STAT_MODE = b.dataset.m; statsPage(); });
  app.querySelectorAll(".seg button[data-s]").forEach(b => b.onclick = () => { STAT_SHOW = b.dataset.s; statsPage(); });
  app.querySelectorAll(".hm th.srt").forEach(h => h.onclick = () => { STAT_SORT = h.dataset.c; statsPage(); });
  app.querySelectorAll(".hm td.hm-c").forEach(c => c.onclick = () => { STAT_PICK = STAT_PICK === c.dataset.p ? null : c.dataset.p; statsPage(); });
}

// ---------------------------------------------------------------- trade calculator (tap chips, sticky result)
let MODEL = null, LM = null, TC = { a: null, b: null, give: new Set(), get: new Set() };
async function tradePage() {
  setNav("trade"); document.title = "Trade calculator · NBA Fantasy 2026";
  if (!MODEL) {
    app.innerHTML = '<p class="empty">Loading…</p>';
    try { MODEL = await (await fetch("data/model.json", { cache: "no-cache" })).json(); LM = LeagueModel.make(MODEL); }
    catch (e) { app.innerHTML = '<p class="empty">The calculator isn\'t available yet.</p>'; return; }
  }
  const teams = MODEL.teams.slice().sort((x, y) => x.name.localeCompare(y.name));
  const mine = teams.find(t => t.name === MY_TEAM);
  if (TC.a == null) { TC.a = (mine || teams[0]).id; TC.b = teams.find(t => t.id !== TC.a).id; }
  const opts = sel => teams.map(t => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  const dd = s => new Date(s + "T12:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  const chips = (tid, set, side) => MODEL.teams.find(x => x.id === tid).players.slice()
    .sort((x, y) => (y.rates ? y.rates["0"] : 0) - (x.rates ? x.rates["0"] : 0)).map(p => {
      const r = p.rates, line = r ? `${r["0"].toFixed(1)} / ${r["6"].toFixed(1)} / ${r["3"].toFixed(1)}` : "no stats";
      const st = (p.status || "ACTIVE").toUpperCase(), hurt = st !== "ACTIVE";
      const badge = hurt ? `<em class="${st.startsWith("DAY") ? "dtd" : "out"}">${st.startsWith("DAY") ? "DTD" : "OUT"}${p.ret ? " · " + dd(p.ret) : ""}</em>` : "";
      return `<button type="button" class="tc-chip${set.has(p.name) ? " on" : ""}" data-side="${side}" data-n="${esc(p.name)}"><b>${esc(p.name)}</b><small>${line}</small>${badge}</button>`;
    }).join("");
  const na = MODEL.teams.find(t => t.id === TC.a).name, nb = MODEL.teams.find(t => t.id === TC.b).name;
  const sgn = x => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2), cls = x => x > 0.005 ? "pos" : x < -0.005 ? "neg" : "";
  let bar, detail = "";
  if (TC.a === TC.b) bar = `<span class="tc-hint">Pick two different teams.</span>`;
  else if (!TC.give.size || !TC.get.size) bar = `<span class="tc-hint">${!TC.give.size && !TC.get.size ? "Tap players on both teams to build a trade." : `Now pick who ${!TC.give.size ? esc(na) : esc(nb)} sends.`}</span>`;
  else {
    const r = LM.evaluate(TC.a, TC.b, [...TC.give], [...TC.get]);
    const even = Math.abs(r.a.change - r.b.change) < 0.03, win = r.a.change > r.b.change ? na : nb;
    bar = `<div class="tc-side"><small>${esc(na)}</small><b class="${cls(r.a.change)}">${sgn(r.a.change)}</b></div>
      <div class="tc-verdict">${even ? "Pretty even" : `<b>${esc(win)}</b> win it`}<small>expected wins</small></div>
      <div class="tc-side r"><small>${esc(nb)}</small><b class="${cls(r.b.change)}">${sgn(r.b.change)}</b></div>`;
    const mx = Math.max(0.02, ...Object.keys(r.a.cats).flatMap(k => [Math.abs(r.a.cats[k]), Math.abs(r.b.cats[k])]));
    const dv = x => { const w = (Math.abs(x) / mx * 50).toFixed(1); return `<span class="tc-dv"><i class="${cls(x)}" style="${x >= 0 ? "left:50%" : "right:50%"};width:${w}%"></i></span>`; };
    const rows = Object.keys(r.a.cats).map(k => `<div class="tc-row"><span class="v ${cls(r.a.cats[k])}">${pct(r.a.cats[k])}</span>${dv(r.a.cats[k])}<b>${k}</b>${dv(r.b.cats[k])}<span class="v ${cls(r.b.cats[k])}">${pct(r.b.cats[k])}</span></div>`).join("");
    const mv = (n, m) => (m.drops.length ? `<p class="note">${esc(n)} would have to drop ${m.drops.map(esc).join(" and ")} to fit everyone in.</p>` : "")
      + (m.adds ? `<p class="note">${esc(n)} gets ${m.adds === 1 ? "an open roster spot" : m.adds + " open roster spots"}, counted as a replacement-level free agent.</p>` : "");
    detail = `<div class="card tc-det"><div class="hm-h"><b>Category win rate vs the league</b><small>change</small></div>
      <div class="tc-head"><span>${esc(na)}</span><span>${esc(nb)}</span></div>${rows}${mv(na, r.a.moves)}${mv(nb, r.b.moves)}
      <p class="note" style="margin-top:8px">Same model as the trade reviews: every remaining matchup (weeks ${MODEL.weeks[0]}–${MODEL.weeks[1]}) scored before and after. Rosters as of ${esc(ago(MODEL.updated_utc))}.</p></div>`;
  }
  const deal = (set) => set.size ? [...set].map(esc).join(" + ") : "—";
  app.innerHTML = `<div class="tc">
    <div class="tc-teams"><select id="ta">${opts(TC.a)}</select><span>⇄</span><select id="tb">${opts(TC.b)}</select></div>
    <div class="tc-deal card"><div><small>${esc(na)} sends</small><b>${deal(TC.give)}</b></div><div><small>${esc(nb)} sends</small><b>${deal(TC.get)}</b></div>
      ${TC.give.size || TC.get.size ? `<button type="button" class="tc-clear">Clear</button>` : ""}</div>
    ${detail}
    <div class="grp">${esc(na)} <span style="text-transform:none;letter-spacing:0;font-weight:600">· pts / reb / ast</span></div><div class="tc-grid">${chips(TC.a, TC.give, "a")}</div>
    <div class="grp">${esc(nb)}</div><div class="tc-grid">${chips(TC.b, TC.get, "b")}</div>
    <div class="tc-bar-wrap"><div class="tc-res">${bar}</div></div></div>`;
  document.getElementById("ta").onchange = e => { TC.a = +e.target.value; TC.give.clear(); tradePage(); };
  document.getElementById("tb").onchange = e => { TC.b = +e.target.value; TC.get.clear(); tradePage(); };
  const clr = app.querySelector(".tc-clear"); if (clr) clr.onclick = () => { TC.give.clear(); TC.get.clear(); tradePage(); };
  app.querySelectorAll(".tc-chip").forEach(c => c.onclick = () => {
    const s = c.dataset.side === "a" ? TC.give : TC.get, n = c.dataset.n;
    s.has(n) ? s.delete(n) : s.add(n);
    const y = window.scrollY; tradePage(); window.scrollTo(0, y);
  });
}

// ---------------------------------------------------------------- injuries (by fantasy team)
let INJ = null, INJ_F = "owned";
async function injuriesPage() {
  setNav("injuries"); document.title = "Injuries · NBA Fantasy 2026";
  if (!INJ) {
    app.innerHTML = '<p class="empty">Loading…</p>';
    try { INJ = await (await fetch("data/injuries.json", { cache: "no-cache" })).json(); }
    catch (e) { app.innerHTML = '<p class="empty">The injury report isn\'t available yet. It appears after the next data refresh.</p>'; return; }
  }
  const all = INJ.players, f = INJ_F;
  const owned = all.filter(p => p.fantasy_team);
  const teams = [...new Set(owned.map(p => p.fantasy_team))];
  const isOut = p => !(p.status || "").toLowerCase().startsWith("day");
  const d = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short" }) : "–";
  const TF = ["Days", "1 week", "1-2 weeks", "2-4 weeks", "1-2 months", "2+ months", "Season", "Unknown"];
  const sev = p => TF.indexOf(p.timeframe) + (isOut(p) ? 0 : -0.5);
  const row = p => {
    const ret = p.timeframe === "Season" ? "Season" : p.days_out === 0 ? "Any day" : d(p.return_date);
    const line = p.per_game ? `${p.per_game.PTS}/${p.per_game.REB}/${p.per_game.AST}` : "";
    const who = f === "owned" || teams.includes(f) ? "" : p.fantasy_team ? ` · ${esc(p.fantasy_team)}` : " · free agent";
    return `<details class="ij"><summary>
      <span class="ij-n"><b>${esc(p.name)}${p.on_ir ? ' <em class="ir">IR</em>' : ""}</b><small>${esc(p.nba_team)} ${esc(p.pos || "")}${line ? " · " + line : ""}${who}</small></span>
      <span class="ij-s ${isOut(p) ? "out" : "dtd"}">${isOut(p) ? "Out" : "DTD"}</span>
      <span class="ij-r"><b>${esc(ret)}</b><small>${p.games_missed == null ? "" : p.games_missed + " gm" + (p.games_missed === 1 ? "" : "s")}</small></span></summary>
      <div class="ij-x">${p.injury ? `<span class="chip ft">${esc(p.injury)}</span> ` : ""}${p.note ? esc(p.note) + ` <small>(${d(p.note_date)})</small>` : "No note yet."}</div></details>`;
  };
  // strip: games-losing players per team (Out counts 1, day-to-day ½)
  const load = t => owned.filter(p => p.fantasy_team === t && !p.on_ir);
  const strip = teams.map(t => [t, load(t).filter(isOut).length, load(t).filter(p => !isOut(p)).length])
    .sort((a, b) => (b[1] + b[2] / 2) - (a[1] + a[2] / 2) || a[0].localeCompare(b[0]));
  const smax = Math.max(1, ...strip.map(s => s[1] + s[2]));
  const stripHtml = `<div class="card ij-strip"><div class="hm-h"><b>Who's hurting</b><small>out · day-to-day · tap a team</small></div>${strip.map(([t, o, q]) =>
    `<button type="button" class="sb${t === MY_TEAM ? " me" : ""}${f === t ? " on" : ""}" data-t="${esc(t)}"><span class="sb-t">${esc(t)}</span><span class="sb-b"><i class="o" style="width:${o / smax * 100}%"></i><i class="q" style="width:${q / smax * 100}%"></i></span><span class="sb-v">${o}${q ? `<small>+${q}</small>` : ""}</span></button>`).join("")}
    <p class="note" style="margin:6px 0 0">Players on IR aren't counted here.</p></div>`;
  let groups;
  if (f === "owned" || teams.includes(f)) {
    const order = (f === "owned" ? teams : [f]).slice().sort((a, b) => (b === MY_TEAM) - (a === MY_TEAM) || a.localeCompare(b));
    groups = order.map(t => { const l = owned.filter(p => p.fantasy_team === t).sort((a, b) => sev(a) - sev(b));
      return `<div class="grp">${esc(t)}${t === MY_TEAM ? " · you" : ""} <span style="text-transform:none;letter-spacing:0;font-weight:600">· ${l.length}</span></div><div class="card ij-card">${l.map(row).join("")}</div>`; }).join("");
  } else {
    const list = all.filter(p => f === "all" || !p.fantasy_team);
    const LBL = { "Days": "Back in a couple of days", "1 week": "Out up to a week", "1-2 weeks": "Out 1–2 weeks", "2-4 weeks": "Out 2–4 weeks", "1-2 months": "Out 1–2 months", "2+ months": "Out 2+ months", "Season": "Out for the season", "Unknown": "No return date" };
    groups = TF.map(k => [k, list.filter(p => p.timeframe === k)]).filter(([, l]) => l.length)
      .map(([k, l]) => `<div class="grp">${LBL[k]} · ${l.length}</div><div class="card ij-card">${l.map(row).join("")}</div>`).join("");
  }
  const opt = (v, t) => `<option value="${esc(v)}"${v === f ? " selected" : ""}>${esc(t)}</option>`;
  app.innerHTML = `<div class="filters"><select id="injf">${opt("owned", "All fantasy teams")}${opt("fa", "Free agents")}${opt("all", "Whole NBA")}${teams.slice().sort().map(t => opt(t, t)).join("")}</select></div>
    ${f === "fa" || f === "all" ? "" : stripHtml}
    ${groups || '<p class="empty">Nobody injured here. Enjoy it while it lasts.</p>'}
    <p class="updated">Updated ${esc(ago(INJ.updated_utc))}. Tap a player for ESPN's latest note. "Back" is ESPN's projected return (US date) and "gms" the games his NBA team plays before then; projections often move.</p>`;
  document.getElementById("injf").onchange = e => { INJ_F = e.target.value; injuriesPage(); };
  app.querySelectorAll(".sb").forEach(b => b.onclick = () => { INJ_F = INJ_F === b.dataset.t ? "owned" : b.dataset.t; injuriesPage(); });
}

let ACC = null, PLOG = null;
async function recordPage() {
  setNav("record"); document.title = "Model record · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  let ODDS = null;
  try {
    if (!ACC) ACC = await (await fetch("data/accuracy.json", { cache: "no-cache" })).json();
    if (!PLOG) PLOG = await (await fetch("data/prediction_log.json", { cache: "no-cache" })).json();
    ODDS = await (await fetch("data/odds.json", { cache: "no-cache" })).json();
  } catch (e) { if (!ACC) { app.innerHTML = '<p class="empty">The model record isn\'t available yet. It appears after the next data refresh.</p>'; return; } }
  const O = ACC.overall, W = ACC.weeks.slice().sort((a, b) => b.period - a.period);
  const pc = x => Math.round(x * 100) + "%";
  const sk = b => Math.round((0.25 - b) / 0.25 * 100);
  const skTxt = b => { const x = sk(b); return x >= 0 ? `${x}% better` : `${-x}% worse`; };
  const MAX = 0.30, pos = b => Math.max(0, Math.min(100, (1 - Math.min(b, MAX) / MAX) * 100));  // 0.30 left → 0.00 right
  const sc = s => `${Math.max(s[0], s[1])}-${Math.min(s[0], s[1])}${s[2] ? "-" + s[2] : ""}`;
  const dots = list => `<span class="rc-dots">${list.map(x => `<i class="${x}"></i>`).join("")}</span>`;

  // ---------- hero: the ruler
  const tick = (v, l) => `<span class="rc-tick" style="left:${pos(v)}%"><em>${l}</em></span>`;
  const hero = `<section class="rc-hero">
    <div class="rc-eyebrow">Model report card · ${W.length} finished week${W.length === 1 ? "" : "s"}</div>
    <div class="rc-big">${skTxt(O.brier)} <span>than guessing</span></div>
    <div class="rc-sub">Brier score <strong>${O.brier.toFixed(3)}</strong> · picked <strong>${O.called} of ${O.matchups}</strong> winners</div>
    <div class="rc-ruler">
      <div class="rc-track"><span class="rc-worse" style="width:${pos(0.25)}%"></span></div>
      ${tick(0.25, "guessing")}${tick(0.15, "good")}${tick(0.05, "elite")}
      <span class="rc-me" style="left:${pos(O.brier)}%"></span>
      <div class="rc-ends"><span>← worse</span><span>better →</span></div>
    </div>
  </section>`;

  // ---------- weeks (in progress + finished)
  let rows = "";
  const cur = ODDS && PLOG && PLOG[String(ODDS.matchup_period)];
  if (cur && !W.some(w => w.period === ODDS.matchup_period)) {
    const ms = cur.matchups.map(m => {
      const now = ODDS.matchups.find(x => x.home === m.home && x.away === m.away);
      const favHome = m.p_home >= 0.5, fav = favHome ? m.home : m.away, fp = Math.max(m.p_home, 1 - m.p_home);
      let st = "lvl", txt = "level";
      if (now && now.score_now[0] !== now.score_now[1]) {
        const homeLead = now.score_now[0] > now.score_now[1];
        st = homeLead === favHome ? "up" : "dn"; txt = (st === "up" ? "favourite ahead " : "underdog ahead ") + sc(now.score_now);
      }
      return { st, html: `<div class="rc-m"><i class="${st}"></i><div><b>${esc(fav)}</b> <small>${pc(fp)} to beat ${esc(favHome ? m.away : m.home)}</small><small>Now: ${txt}</small></div></div>` };
    });
    rows += `<details class="rc-wk live"><summary><span class="rc-wn">W${ODDS.matchup_period}</span>
      <span class="rc-mid"><span class="rc-lbl">In progress</span>${dots(ms.map(m => m.st))}</span><span class="rc-val">live</span></summary>
      <p class="rc-note">Monday's picks vs the score now. Early leads swing a lot. Scored when the week ends.</p>${ms.map(m => m.html).join("")}</details>`;
  }
  rows += W.map(w => {
    const ms = w.matchups.map(m => {
      const win = m.winner === "TIE" ? "Tied" : (m.winner === "HOME" ? m.home : m.away) + " won";
      return `<div class="rc-m"><i class="${m.called ? "ok" : "no"}"></i><div><b>${esc(m.fav)}</b> <small>${pc(m.fav_p)} to beat ${esc(m.fav === m.home ? m.away : m.home)}</small><small>${esc(win)} ${sc(m.score)}</small></div></div>`;
    }).join("");
    const x = sk(w.brier);
    const note = w.started ? `<p class="rc-note">Picks were saved after Monday's games had started (a one-off, now fixed), so this week flatters the model slightly.</p>`
      : w.source === "live" || w.source.startsWith("stored") ? "" : `<p class="rc-note">Picks taken from the first daily post a few days in, so this week flatters the model a little.</p>`;
    return `<details class="rc-wk"><summary><span class="rc-wn">W${w.period}</span>
      <span class="rc-mid"><span class="rc-lbl">${w.called} of ${w.n} right · Brier ${w.brier.toFixed(3)}</span>${dots(w.matchups.map(m => m.called ? "ok" : "no"))}</span>
      <span class="rc-val ${x >= 0 ? "pos" : "neg"}">${x >= 0 ? "+" : "−"}${Math.abs(x)}%</span></summary>${note}${ms}</details>`;
  }).join("");
  const asc = W.slice().sort((a, b) => a.period - b.period);
  const top = Math.max(30, ...asc.map(w => sk(w.brier))), bot = Math.max(10, ...asc.map(w => -sk(w.brier)));
  const span = top + bot, zero = top / span * 100, seasonY = (top - sk(O.brier)) / span * 100;
  const bars = asc.map(w => {
    const x = sk(w.brier), h = Math.abs(x) / span * 100;
    return `<div class="rc-col"><div class="rc-plot"><span class="rc-b ${x >= 0 ? "up" : "dn"}" style="${x >= 0 ? `bottom:${100 - zero}%` : `top:${zero}%`};height:${h}%"><em>${x >= 0 ? "+" : "−"}${Math.abs(x)}%</em></span></div><span class="rc-x">W${w.period}</span></div>`;
  }).join("");
  const chart = `<div class="rc-chart"><div class="rc-cols" style="--z:${zero}%">
      <span class="rc-zero" style="top:${zero}%"><em>guessing</em></span>
      <span class="rc-avg" style="top:${seasonY}%"><em>season ${sk(O.brier) >= 0 ? "+" : "−"}${Math.abs(sk(O.brier))}%</em></span>${bars}</div>
      <p class="rc-cap">Each bar is one week's Brier score turned into % better (green, up) or worse (red, down) than guessing. The dashed line is the season so far.</p></div>`;
  const weeks = `<section><h2 class="rc-h">Week by week <small>tap a week to see every pick</small></h2>${chart}<div class="rc-list">${rows}</div></section>`;

  // ---------- confidence
  const all = W.flatMap(w => w.matchups);
  const bands = [["50–60%", .5, .6], ["60–75%", .6, .75], ["75–90%", .75, .9], ["90%+", .9, 1.01]].map(([l, lo, hi]) => {
    const g = all.filter(m => m.fav_p >= lo && m.fav_p < hi).sort((a, b) => b.called - a.called);
    if (!g.length) return "";
    const won = g.filter(m => m.called).length, exp = g.reduce((t, m) => t + m.fav_p, 0);
    const [cls, v] = g.length < 4 ? ["", "Too early"] : won > exp + 1 ? ["warn", "Too cautious"] : won < exp - 1 ? ["bad", "Too cocky"] : ["good", "About right"];
    return `<div class="rc-band"><span class="rc-bl">${l}</span><span>${dots(g.map(m => m.called ? "ok" : "no"))}<small>won ${won} of ${g.length} · expected ${exp.toFixed(1)}</small></span><span class="rc-chip ${cls}">${v}</span></div>`;
  }).join("");
  const conf = `<section><h2 class="rc-h">Does it know when it's sure? <small>favourite's chance → how often they won</small></h2><div class="rc-panel">${bands}</div></section>`;

  // ---------- categories
  const catPending = `<section><h2 class="rc-h">By category <small>which stats the model reads best</small></h2><div class="rc-panel"><p class="rc-cap" style="margin:12px 0">Starts with week 3. The model only began saving its Monday chance for each category this week, so weeks 1 and 2 can't be scored fairly. From next Monday this section ranks all 9 categories, best to worst, by how much better than guessing it calls each one.</p></div></section>`;
  const cats = !O.categories ? catPending : `<section><h2 class="rc-h">By category <small>${Math.round(O.cat_called)} of ${O.categories} right</small></h2><div class="rc-panel rc-cats">${
    O.by_category.slice().sort((a, b) => a.brier - b.brier).map(c => `<div class="rc-cat"><b>${esc(c.cat)}</b><span class="rc-bar"><i style="width:${pos(c.brier)}%"></i><u style="left:${pos(0.25)}%"></u></span><small>${skTxt(c.brier)}</small></div>`).join("")}</div></section>`;

  // ---------- how it works (one drawer)
  const how = `<details class="rc-how"><summary>How this works</summary><div class="explain">
    <h3>The model, in five steps</h3>
    <ol><li><strong>How good is each player?</strong> Their per-game averages in all 9 categories, mixed with last season early on so one hot week doesn't fool it.</li>
      <li><strong>How many games?</strong> The real NBA schedule. Healthy players play about 93% of games; injured players count as out until their projected return.</li>
      <li><strong>Who starts?</strong> It assumes every manager sets their best lineup each day.</li>
      <li><strong>Play the week 1,000 times</strong> with real-game randomness. Win 700 of the runs and that's a 70% chance.</li>
      <li><strong>Odds</strong> are that % turned into bookie prices, just for fun.</li></ol>
    <h3>The Brier score</h3>
    <p>Counting right picks treats a lucky 51% call the same as a 95% "lock". The Brier score rewards being <strong>confident and right</strong> and punishes being <strong>confident and wrong</strong>.</p>
    <p>For each matchup, take the chance the model gave the team that won, see how far short of 100% it was, and square it. That's the penalty:</p>
    <table class="cats"><tr><th>Model gave the winner</th><th>Penalty</th></tr>
      <tr><td>95%</td><td class="pos">0.00</td></tr><tr><td>80%</td><td class="pos">0.04</td></tr><tr><td>50%</td><td>0.25</td></tr>
      <tr><td>20% (backed the loser)</td><td class="neg">0.64</td></tr><tr><td>5% (backed the loser hard)</td><td class="neg">0.90</td></tr></table>
    <p>The score is the average penalty, so <strong>lower is better</strong>. One confident miss costs as much as about 20 decent calls.</p>
    <h3>Why guessing scores 0.25</h3>
    <p>"Guessing" means saying 50/50 for every matchup. Whoever wins, that's 0.50 short of 100%, and 0.50 × 0.50 = 0.25. Every time. That's the line to beat.</p>
    <p><strong>% better than guessing = (0.25 − score) ÷ 0.25.</strong> So 0.10 is 60% better, 0.15 is 40% better, 0.20 is 20% better, and anything over 0.25 is worse than guessing.</p>
  </div></details>`;

  app.innerHTML = `<div class="rc">${hero}${weeks}${conf}${cats}${how}</div>`;
}

let TR = null;
function tradeChart(series, A, B) {
  // each team's matchup wins added since the trade, day by day (series: [date, margin, winsA, winsB])
  if (!series || !series.length || series[0].length < 4) return "";
  const pts = [[null, 0, 0, 0], ...series], n = pts.length - 1;
  const big = Math.max(0.005, ...pts.map(p => Math.max(Math.abs(p[2]), Math.abs(p[3]))));
  const step = [0.005, 0.01, 0.02, 0.025, 0.05, 0.1, 0.2, 0.25, 0.5, 1].find(s => s * 2 >= big) || 1;
  const lim = step * 2 * 1.08;
  const W = 600, H = 132, X = i => i / n * W, Y = v => (1 - (v + lim) / (2 * lim)) * H, pct = y => (y + 2) / (H + 4) * 100;
  const path = k => pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[k]).toFixed(1)).join(" ");
  const sg = x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(Math.abs(x) >= 0.1 || step >= 0.05 ? 2 : 3).replace(/^0\./, ".");
  const fd = x => new Date(x + "T12:00:00").toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  const ticks = [-2, -1, 0, 1, 2].map(k => `<span class="tc-y" style="top:${pct(Y(k * step))}%">${k ? sg(k * step) : "0"}</span>`).join("");
  const grid = [-2, -1, 1, 2].map(k => `<line x1="0" x2="${W}" y1="${Y(k * step)}" y2="${Y(k * step)}" class="wp-grid" vector-effect="non-scaling-stroke"/>`).join("");
  // end labels: nudge apart if they'd overlap
  let ya = pct(Y(pts[n][2])), yb = pct(Y(pts[n][3]));
  if (Math.abs(ya - yb) < 13) { const m = (ya + yb) / 2, d = ya <= yb ? -6.5 : 6.5; ya = m + d; yb = m - d; }
  const data = esc(JSON.stringify(pts.map((p, i) => [X(i) / W * 100, p[0], p[2], p[3]])));
  return `<div class="wp tc" data-p="${data}" data-a="${esc(A)}" data-b="${esc(B)}">
    <div class="tc-wrap"><div class="tc-axis">${ticks}</div><div class="wp-plot" style="height:136px">
      <svg viewBox="0 -2 ${W} ${H + 4}" preserveAspectRatio="none" style="height:136px">${grid}
        <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="wp-mid"/>
        <path d="${path(3)}" class="tc-b" vector-effect="non-scaling-stroke"/>
        <path d="${path(2)}" class="tc-a" vector-effect="non-scaling-stroke"/>
        <line class="wp-cur" x1="0" x2="0" y1="0" y2="${H}" style="display:none" vector-effect="non-scaling-stroke"/></svg>
      <span class="wp-dot a" style="left:100%;top:${pct(Y(pts[n][3]))}%"></span><span class="wp-dot" style="left:100%;top:${pct(Y(pts[n][2]))}%"></span>
      <span class="tc-end ka ${pts[n][2] >= 0 ? "pos" : "neg"}" style="top:${ya}%">${sg(pts[n][2])}</span>
      <span class="tc-end kb ${pts[n][3] >= 0 ? "pos" : "neg"}" style="top:${yb}%">${sg(pts[n][3])}</span>
      <div class="wp-tip"></div></div></div>
    <div class="tc-dates"><span>Trade</span><span>${fd(series[n - 1][0])}</span></div>
    <div class="tc-key"><span class="ka">${esc(A)}</span><span class="kb">${esc(B)}</span><span class="kn">wins added · tap for any day</span></div></div>`;
}
function wireTradeCharts() {
  app.querySelectorAll(".tc").forEach(el => {
    const P = JSON.parse(el.dataset.p), plot = el.querySelector(".wp-plot"), cur = el.querySelector(".wp-cur"), tip = el.querySelector(".wp-tip");
    const f = x => `<span class="${x > 0.0005 ? "pos" : x < -0.0005 ? "neg" : ""}">${(x >= 0 ? "+" : "−") + Math.abs(x).toFixed(3)}</span>`;
    const show = e => {
      const r = plot.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 100;
      const p = P.reduce((a, b) => Math.abs(b[0] - x) < Math.abs(a[0] - x) ? b : a);
      cur.setAttribute("x1", p[0] * 6); cur.setAttribute("x2", p[0] * 6); cur.style.display = "";
      const day = p[1] ? new Date(p[1] + "T12:00:00").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }) : "Trade day";
      tip.innerHTML = `<b>${day}</b><br>${esc(el.dataset.a)} ${f(p[2])}<br>${esc(el.dataset.b)} ${f(p[3])}`;
      tip.style.left = Math.min(Math.max(p[0], 22), 78) + "%"; tip.style.opacity = 1;
    };
    plot.addEventListener("pointermove", show); plot.addEventListener("pointerdown", show);
    plot.addEventListener("pointerleave", () => { cur.style.display = "none"; tip.style.opacity = 0; });
  });
}

    <details class="rc-how"><summary>How it's measured</summary><div class="explain">
      <p>A pickup only counts for the team that added him, in games he <strong>started</strong> for them, from the day of the add until he's dropped or traded. It's not his season total.</p>

    const head = (mid) => `<div class="mu-head"><div class="mu-team">${esc(A)}<small>${gets(t, A)}</small></div>${mid}<div class="mu-team r">${esc(B)}<small>${gets(t, B)}</small></div></div>`;
    if (!F) {
      const at = t.at_time ? `<div class="mu-odds"><span><strong class="${cls(t.at_time[A])}">${sg(t.at_time[A])}</strong> expected</span><span>expected <strong class="${cls(t.at_time[B])}">${sg(t.at_time[B])}</strong></span></div>` : "";
      return `<div class="card tr"><div class="tr-meta">${when(t.accepted_utc)} · in league review</div>${head('<div class="mu-score tr-pend">vs</div>')}${at}</div>`;
    }
    const [w, l, d] = F.score, g = F.grade, wa = F.wins_added || {};
    const total = Math.max(w + l, 1);
    const gr = x => x === "Too early" ? "" : ` · <b>${esc(x)}</b>`;
    const rows = F.cats.map(c => { const f = v => v == null ? "–" : c.cat.includes("%") ? v.toFixed(3).replace(/^0/, "") : Math.round(v);
      return `<tr><td>${c.cat}</td><td class="${c.res === 1 ? "win" : ""}">${f(c.got)}</td><td class="${c.res === -1 ? "win" : ""}">${f(c.gave)}</td></tr>`; }).join("");
    const row = (label, o, strong) => o ? `<tr><td>${label}</td><td class="${cls(o[A])}">${strong ? "<strong>" : ""}${sg(o[A])}${strong ? "</strong>" : ""}</td><td class="${cls(o[B])}">${strong ? "<strong>" : ""}${sg(o[B])}${strong ? "</strong>" : ""}</td></tr>` : "";
    const early = Math.min(...Object.values(F.games)) < 12 ? " · early days" : "";
    return `<div class="card tr"><div class="tr-meta">${when(t.accepted_utc)} · ${F.days} day${F.days === 1 ? "" : "s"}${early}</div>
      ${head(`<div class="mu-score">${w}-${l}${d ? `<small>-${d}</small>` : ""}</div>`)}
      <div class="bar"><i style="width:${w / total * 100}%"></i><b style="width:${l / total * 100}%"></b></div>
      <div class="mu-odds"><span><strong class="${cls(wa[A])}">${sg(wa[A])}</strong> wins${gr(g[A])}</span><span>${gr(g[B]).replace(" · ", "")}${g[B] === "Too early" ? "" : " · "}wins <strong class="${cls(wa[B])}">${sg(wa[B])}</strong></span></div>
      ${tradeChart(F.series, A, B)}
      <details><summary>Details</summary>
        <table class="cats"><tr><th>Since ${when(F.from + "T12:00:00")}</th><th>${esc(short(A))}</th><th>${esc(short(B))}</th></tr>
          <tr><td>Games started</td><td>${F.games[A]}</td><td>${F.games[B]}</td></tr>${rows}</table>
        <table class="cats" style="margin-top:14px"><tr><th>Matchup wins</th><th>${esc(short(A))}</th><th>${esc(short(B))}</th></tr>
          ${row("Added so far", wa, true)}${row(`Expected at the time${t.post ? ` · <a href="#/${esc(t.post)}">review</a>` : ""}`, t.at_time)}${row(t.now_frozen ? "Expected from today (frozen)" : "Expected from today", t.now)}</table>
      </details></div>`;
  }).join("");

  const how = `<details class="rc-how"><summary>How this works</summary><div class="explain">
    <p><strong>The score</strong> treats each trade as a matchup between the two hauls: one team's new players against the other's, across all 9 categories. Only games a player started for his new team count, and he stops counting if he's dropped or traded on.</p>
    <p><strong>Wins</strong> is how many matchup wins the trade has actually been worth to each team so far. It weighs each category by how much it moves that team's real chances, so stats a team didn't need barely count. That's why the score and the wins can disagree.</p>
    <p><strong>Grades</strong> come from wins added per week and appear once both sides have 12 games.</p>
    <p><strong>The chart</strong> tracks each team's wins added, day by day since the trade. Both lines start at 0; the one climbing is the team winning the trade.</p>
    <p><strong>Details</strong> has the stats behind it, plus what the model expected when the trade happened and what it expects from today on.</p></div></details>`;
  app.innerHTML = `<p class="updated">Every trade this season and who's actually winning it · updated ${esc(ago(TR.updated_utc))}.</p>${cards}${how}`;
  wireTradeCharts();
}

function route() {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (slug === "odds") return oddsPage();
  if (slug === "ladder") return ladderPage();
  if (slug === "power") { LAD_SORT = "power"; return ladderPage(); }
  if (slug === "trade") return tradePage();
  if (slug === "stats") return statsPage();
  if (slug === "injuries") return injuriesPage();
  if (slug === "record") return recordPage();
  if (slug === "trades") return movesPage();
  if (slug === "waivers") { MOVES_TAB = "waivers"; return movesPage(); }
  if (slug === "offers") { MOVES_TAB = "offers"; return movesPage(); }
  setNav("posts");
  slug ? show(slug) : home();
}

fetch("posts/index.json", { cache: "no-cache" })
  .then(r => r.json()).then(j => { posts = j; route(); })
  .catch(() => { app.innerHTML = '<p class="empty">Couldn\'t load posts.</p>'; });
window.addEventListener("hashchange", route);
</script>
</body>
</html>
