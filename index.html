<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Fantasy 2026 Blog</title>
<meta name="description" content="Daily posts, trade reviews and weekly roundups for the NBA FANTASY 2026 league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #16181d; --muted: #5d6270; --line: #e3e0d8;
    --accent: #e8590c; --accent-soft: #fdebe0; --head: #121826; --head-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --ink: #eceef2; --muted: #9aa1ae; --line: #262c37;
            --accent: #ff7a2f; --accent-soft: #2b1d14; --head: #0a0d12; --head-ink: #ffffff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.6 Inter, system-ui, -apple-system, sans-serif; }
  header { background: var(--head); color: var(--head-ink); padding: 28px 16px 24px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header .wrap { padding: 0; }
  header a { color: inherit; text-decoration: none; }
  .brand { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 38px);
           letter-spacing: -0.5px; line-height: 1.1; }
  .brand span { color: var(--accent); }
  .tag { color: #b8bfcc; font-size: 14px; margin-top: 6px; }
  main { padding: 24px 0 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px 20px; margin-bottom: 14px; display: block; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11px;
          text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 99px; }
  .card h2 { margin: 6px 0 4px; font-size: 20px; line-height: 1.3; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  article h1 { font-family: "Archivo Black", Inter, sans-serif; font-size: clamp(26px, 6vw, 34px);
               line-height: 1.15; margin: 8px 0 16px; }
  article h2 { font-size: 20px; margin: 28px 0 8px; }
  article a { color: var(--accent); }
  article table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap; }
  article ul, article ol { padding-left: 22px; }
  article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  .back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .empty { color: var(--muted); }
  nav { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  nav a { color: #cfd5e0; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px;
          border-radius: 99px; border: 1px solid #2c3446; }
  nav a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .updated { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .mu-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .mu-team { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .mu-team.r { text-align: right; }
  .mu-score { font-family: "Archivo Black", Inter, sans-serif; font-size: 22px; text-align: center; white-space: nowrap; }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin: 10px 0 4px; background: var(--line); }
  .bar i { display: block; background: var(--accent); }
  .bar b { display: block; background: var(--muted); opacity: .45; }
  .mu-odds { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .mu-odds strong { color: var(--ink); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
  .cats { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
  .cats td, .cats th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  .cats th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .cats td:first-child, .cats th:first-child { text-align: left; font-weight: 600; }
  .win { font-weight: 700; }
  .calc label.lbl { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0; }
  .calc select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); }
  .plist { margin-top: 10px; display: grid; gap: 4px; }
  .plist label { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 6px 4px; border-radius: 8px; }
  .plist label:hover { background: var(--accent-soft); }
  .plist small { color: var(--muted); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .res .big { font-family: "Archivo Black", Inter, sans-serif; font-size: 28px; }
  .pos { color: #2f9e44; } .neg { color: #e03131; }
  .note { font-size: 13px; color: var(--muted); }
  .ladder { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ladder th { color: var(--muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  .ladder td { padding: 9px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ladder th:nth-child(2), .ladder td:nth-child(2) { text-align: left; white-space: normal; }
  .ladder th:first-child, .ladder td:first-child { text-align: left; color: var(--muted); width: 22px; }
  .ladder tr.cut td { border-bottom: 2px dashed var(--accent); }
  .ladder .tm { font-weight: 700; }
  .ladder small { color: var(--muted); display: block; font-size: 12px; }
  .up { color: #2f9e44; font-size: 12px; } .down { color: #e03131; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .dg { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .dg:last-child { border-bottom: 0; }
  .dg .rk { color: var(--muted); font-size: 13px; }
  .dg .nm { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .dg .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .dg .score { font-family: "Archivo Black", Inter, sans-serif; font-size: 24px; min-width: 44px; text-align: right; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .chip.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .explain h3 { font-size: 16px; margin: 16px 0 4px; }
  .explain p, .explain li { font-size: 14.5px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters select { flex: 1; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px 32px; }
</style>
</head>
<body>
<header><div class="wrap">
  <a href="#"><div class="brand">NBA FANTASY <span>2026</span></div></a>
  <div class="tag">Daily posts, trade reviews and weekly roundups. Updated automatically.</div>
  <nav><a href="#/" data-n="posts">Posts</a><a href="#/ladder" data-n="ladder">Ladder</a><a href="#/odds" data-n="odds">Live odds</a><a href="#/trade" data-n="trade">Trade calculator</a><a href="#/dawg" data-n="dawg">Dawg index</a></nav>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<footer>Odds and expected wins come from a model, not a crystal ball.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="model.js"></script>
<script>
const app = document.getElementById("app");
const KIND = { daily: "Daily", weekly: "Weekly roundup", trade: "Trade review", draft: "Draft review" };
let posts = [];

function niceDate(d) {
  const dt = new Date(d + "T12:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function meta(p) { return `<div class="meta"><span class="pill">${esc(KIND[p.kind] || p.kind)}</span><span>${esc(niceDate(p.date))}</span></div>`; }

function home() {
  document.title = "NBA Fantasy 2026 Blog";
  if (!posts.length) { app.innerHTML = '<p class="empty">No posts yet.</p>'; return; }
  app.innerHTML = posts.map(p => `<a class="card" href="#/${encodeURIComponent(p.slug)}">${meta(p)}<h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p></a>`).join("");
}

async function show(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) { home(); return; }
  app.innerHTML = '<p class="empty">Loading…</p>';
  try {
    let md = await (await fetch(`posts/${encodeURIComponent(slug)}.md`, { cache: "no-cache" })).text();
    md = md.replace(/^---[\s\S]*?\n---\s*/, "");
    document.title = p.title + " · NBA Fantasy 2026";
    app.innerHTML = `<a class="back" href="#">← All posts</a><article>${meta(p)}<h1>${esc(p.title)}</h1>${DOMPurify.sanitize(marked.parse(md))}</article>`;
    window.scrollTo(0, 0);
  } catch (e) { app.innerHTML = '<p class="empty">Couldn\'t load that post.</p>'; }
}

function setNav(n) { document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.n === n)); }
const pct = x => (x > 0 ? "+" : "") + (100 * x).toFixed(1) + " pts";
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
}

const short = n => n.replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/)[0].slice(0, 9);
async function oddsPage() {
  setNav("odds"); document.title = "Live odds · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  let o;
  try { o = await (await fetch("data/odds.json", { cache: "no-cache" })).json(); }
  catch (e) { app.innerHTML = '<p class="empty">Live odds aren\'t available yet.</p>'; return; }
  const cards = o.matchups.map(m => {
    const rows = m.categories.map(c => {
      const h = c.home_win_pct, fmt = v => c.cat.includes("%") ? Number(v).toFixed(3).replace(/^0/, "") : Math.round(v);
      return `<tr><td>${esc(c.cat)}</td><td>${fmt(c.now_home)}</td><td>${fmt(c.now_away)}</td><td class="${h >= 50 ? "win" : ""}">${h}%</td><td class="${h < 50 ? "win" : ""}">${100 - h}%</td></tr>`;
    }).join("");
    return `<div class="card"><div class="mu-head"><div class="mu-team">${esc(m.home)}</div>
      <div class="mu-score">${m.score_now[0]}-${m.score_now[1]}${m.score_now[2] ? "-" + m.score_now[2] : ""}</div>
      <div class="mu-team r">${esc(m.away)}</div></div>
      <div class="bar"><i style="width:${m.home_win_pct}%"></i><b style="width:${m.away_win_pct}%"></b></div>
      <div class="mu-odds"><span><strong>${m.home_win_pct}%</strong> · $${m.price_home.toFixed(2)}</span><span>$${m.price_away.toFixed(2)} · <strong>${m.away_win_pct}%</strong></span></div>
      <details><summary>Categories</summary><table class="cats"><tr><th></th><th colspan="2">Right now</th><th colspan="2">Chance to win</th></tr><tr><th>Cat</th><th>${esc(short(m.home))}</th><th>${esc(short(m.away))}</th><th>${esc(short(m.home))}</th><th>${esc(short(m.away))}</th></tr>${rows}</table></details></div>`;
  }).join("");
  app.innerHTML = `<p class="updated">Week ${o.matchup_period} · updated ${esc(ago(o.updated_utc))} · refreshes every 30 min. Score = categories won right now; win % simulates the rest of the week 1,000 times.</p>${cards}`;
}

async function ladderPage() {
  setNav("ladder"); document.title = "Ladder · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  let L;
  try { L = await (await fetch("data/league.json", { cache: "no-cache" })).json(); }
  catch (e) { app.innerHTML = '<p class="empty">The ladder isn\'t available yet.</p>'; return; }
  const mv = x => !x ? "" : `<span class="${x > 0 ? "up" : "down"}"> ${x > 0 ? "▲" : "▼"}${Math.abs(x).toFixed(1)}</span>`;
  const price = x => "$" + (x >= 10 ? Math.round(x) : x.toFixed(2));
  const rows = L.ladder.map((r, i) => `<tr class="${i === L.finals_teams - 1 ? "cut" : ""}">
    <td>${r.seed ?? i + 1}</td>
    <td><span class="tm">${esc(r.team)}</span><small>${r.cats[0]}-${r.cats[1]}-${r.cats[2]} cats · power ${r.power_pct}%</small></td>
    <td>${r.w}-${r.l}${r.t ? "-" + r.t : ""}</td>
    <td>${Math.round(r.finals_pct)}%${mv(r.finals_move)}<small>${price(r.finals_price)}</small></td>
    <td>${r.title_pct >= 1 ? Math.round(r.title_pct) : r.title_pct.toFixed(1)}%${mv(r.title_move)}<small>${price(r.title_price)}</small></td></tr>`).join("");
  app.innerHTML = `<p class="updated">Updated ${esc(ago(L.updated_utc))}. Top ${L.finals_teams} make the finals (dashed line). Finals and title chances come from ${L.sims.toLocaleString()} simulated seasons, using this week's live odds; arrows show the change over the last day.</p>
    <div class="card scroll"><table class="ladder"><tr><th>#</th><th>Team</th><th>Rec</th><th>Finals</th><th>Title</th></tr>${rows}</table></div>`;
}

let DAWG = null;
async function dawgPage() {
  setNav("dawg"); document.title = "Dawg index · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  try { if (!DAWG) DAWG = await (await fetch("data/dawg.json", { cache: "no-cache" })).json(); }
  catch (e) { app.innerHTML = '<p class="empty">The Dawg index isn\'t available yet.</p>'; return; }
  const teams = [...new Set(DAWG.players.map(p => p.team))].sort();
  app.innerHTML = `<p class="updated">Who's playing like a dawg? A 0-100 score for every rostered player, updated ${esc(ago(DAWG.updated_utc))}.</p>
    <details class="card explain"><summary>How the Dawg index works</summary>
      <p>Every player gets three scores from 0 to 100. Each one is a <strong>percentile</strong>: a Hustle of 90 means he's out-hustling 90% of the players on a fantasy roster in this league.</p>
      <h3>🐶 Hustle (40%)</h3>
      <p>The dirty work, per 36 minutes this season: rebounds, steals and blocks, minus turnovers. Steals and blocks count 2.5 times as much as a rebound. Rebounds are scaled by position, because a guard grabbing boards is grittier than a centre doing it: guards ×1.4, small forwards ×1.1, power forwards ×0.8, centres ×0.6. Then it's scaled by availability: a player who has played every one of his team's games keeps 100%, one who has played none keeps 70%. Needs 2+ games and 8+ minutes a night.</p>
      <h3>🔥 Heat check (40%)</h3>
      <p>His fantasy score per game over the last 7 days, compared with his normal level (ESPN's projection for him, or last season if there isn't one). The "+30%" next to it means he's been 30% better than usual this week. Fantasy score = points + 1.2×rebounds + 1.5×assists + 3×steals + 3×blocks + threes − 1.5×turnovers. Needs 2+ games in the last week.</p>
      <h3>💪 Big-game (20%)</h3>
      <p>Does he show up when it matters? We take every game he started for his fantasy team while that team's matchup was close (decided by 2 categories or fewer, or within 2 right now for this week), and compare his fantasy score in those games with his average in all his games. Needs 2+ close-matchup games, so it's blank for most players early in the season. When it's blank, Hustle and Heat count 50/50.</p>
      <h3>The Dawg index</h3>
      <p>40% Hustle + 40% Heat + 20% Big-game, rounded to a 0-100 score. It's for fun and bragging rights: it rewards effort and form, not overall fantasy value, which is why role players can top it.</p>
    </details>
    <div class="filters"><select id="dt"><option value="">All teams</option>${teams.map(t => `<option>${esc(t)}</option>`).join("")}</select></div>
    <div class="card" id="dl"></div>`;
  const draw = () => {
    const team = document.getElementById("dt").value;
    const list = DAWG.players.filter(p => p.dawg !== null && (!team || p.team === team));
    const shown = team ? list : list.slice(0, 50);
    const chip = (label, v, extra) => v === null || v === undefined ? `<span class="chip off">${label} —</span>` : `<span class="chip">${label} ${v}${extra || ""}</span>`;
    const sgn = x => x === undefined || x === null ? "" : ` (${x >= 0 ? "+" : ""}${x}%)`;
    document.getElementById("dl").innerHTML = shown.map((p, i) => `<div class="dg"><div class="rk">${i + 1}</div>
      <div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.pos)} · ${esc(p.team)}${p.status !== "ACTIVE" ? " · " + esc(p.status.replace(/_/g, " ").toLowerCase()) : ""}</div>
      <div class="chips">${chip("Hustle", p.hustle)}${chip("Heat", p.heat, sgn(p.heat_vs_normal_pct))}${chip("Big-game", p.big, sgn(p.big_vs_normal_pct))}</div></div>
      <div class="score">${p.dawg}</div></div>`).join("") + (team ? "" : `<p class="note">Top 50 shown. Pick a team to see its whole roster.</p>`);
  };
  document.getElementById("dt").onchange = draw; draw();
}

let MODEL = null, LM = null;
async function tradePage() {
  setNav("trade"); document.title = "Trade calculator · NBA Fantasy 2026";
  app.innerHTML = '<p class="empty">Loading…</p>';
  try { if (!MODEL) { MODEL = await (await fetch("data/model.json", { cache: "no-cache" })).json(); LM = LeagueModel.make(MODEL); } }
  catch (e) { app.innerHTML = '<p class="empty">The calculator isn\'t available yet.</p>'; return; }
  const teams = MODEL.teams.slice().sort((x, y) => x.name.localeCompare(y.name));
  const opts = sel => teams.map(t => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  app.innerHTML = `<div class="calc">
    <p class="updated">Pick two teams and tick the players each side sends. The model scores every remaining matchup (weeks ${MODEL.weeks[0]}-${MODEL.weeks[1]}) before and after.</p>
    <div class="card"><label class="lbl">Team A sends</label><select id="ta">${opts(teams[0].id)}</select><div class="plist" id="pa"></div></div>
    <div class="card"><label class="lbl">Team B sends</label><select id="tb">${opts(teams[1].id)}</select><div class="plist" id="pb"></div></div>
    <div id="out"></div></div>`;
  const ta = document.getElementById("ta"), tb = document.getElementById("tb");
  const list = (sel, box) => {
    const t = MODEL.teams.find(x => x.id === +sel.value);
    box.innerHTML = t.players.slice().sort((x, y) => (y.rates ? y.rates["0"] : 0) - (x.rates ? x.rates["0"] : 0)).map(p => {
      const r = p.rates, line = r ? `${r["0"].toFixed(1)} pts · ${r["6"].toFixed(1)} reb · ${r["3"].toFixed(1)} ast` : "no stats";
      const inj = p.status && p.status !== "ACTIVE" ? ` · ${esc(p.status.replace(/_/g, " ").toLowerCase())}` : "";
      return `<label><input type="checkbox" value="${esc(p.name)}"> <span>${esc(p.name)}<br><small>${line}${inj}</small></span></label>`;
    }).join("");
  };
  const movesNote = (n, m) => (m.drops.length ? `<p class="note">${esc(n)} would have to drop ${m.drops.map(esc).join(" and ")} (their least valuable player) to fit everyone in.</p>` : "")
    + (m.adds ? `<p class="note">${esc(n)} gets ${m.adds === 1 ? "an open roster spot" : m.adds + " open roster spots"}, counted as a replacement-level free agent.</p>` : "");
  const run = () => {
    const out = document.getElementById("out");
    const a = +ta.value, b = +tb.value;
    const give = [...document.querySelectorAll("#pa input:checked")].map(x => x.value);
    const get = [...document.querySelectorAll("#pb input:checked")].map(x => x.value);
    if (a === b) { out.innerHTML = '<p class="note">Pick two different teams.</p>'; return; }
    if (!give.length || !get.length) { out.innerHTML = '<p class="note">Tick at least one player on each side.</p>'; return; }
    const r = LM.evaluate(a, b, give, get), na = MODEL.teams.find(t => t.id === a).name, nb = MODEL.teams.find(t => t.id === b).name;
    const sgn = x => (x >= 0 ? "+" : "") + x.toFixed(3), cls = x => x > 0.0005 ? "pos" : x < -0.0005 ? "neg" : "";
    const rows = Object.keys(r.a.cats).map(k => `<tr><td>${k}</td><td class="${cls(r.a.cats[k])}">${pct(r.a.cats[k])}</td><td class="${cls(r.b.cats[k])}">${pct(r.b.cats[k])}</td></tr>`).join("");
    const winner = Math.abs(r.a.change - r.b.change) < 0.03 ? "Pretty even trade." : (r.a.change > r.b.change ? esc(na) : esc(nb)) + " win this one.";
    out.innerHTML = `<div class="card"><div class="res">
      <div><div class="note">${esc(na)}</div><div class="big ${cls(r.a.change)}">${sgn(r.a.change)}</div><div class="note">expected wins</div></div>
      <div><div class="note">${esc(nb)}</div><div class="big ${cls(r.b.change)}">${sgn(r.b.change)}</div><div class="note">expected wins</div></div></div>
      <p><strong>${winner}</strong></p>${movesNote(na, r.a.moves)}${movesNote(nb, r.b.moves)}
      <table class="cats"><tr><th>Category win rate vs league</th><th>${esc(na)}</th><th>${esc(nb)}</th></tr>${rows}</table>
      <p class="note">Same model as the trade reviews. Rosters as of ${esc(ago(MODEL.updated_utc))}.</p></div>`;
  };
  ta.onchange = () => { list(ta, document.getElementById("pa")); run(); };
  tb.onchange = () => { list(tb, document.getElementById("pb")); run(); };
  app.querySelector(".calc").addEventListener("change", e => { if (e.target.type === "checkbox") run(); });
  list(ta, document.getElementById("pa")); list(tb, document.getElementById("pb")); run();
}

function route() {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (slug === "odds") return oddsPage();
  if (slug === "ladder") return ladderPage();
  if (slug === "dawg") return dawgPage();
  if (slug === "trade") return tradePage();
  setNav("posts");
  slug ? show(slug) : home();
}

fetch("posts/index.json", { cache: "no-cache" })
  .then(r => r.json()).then(j => { posts = j; route(); })
  .catch(() => { app.innerHTML = '<p class="empty">Couldn\'t load posts.</p>'; });
window.addEventListener("hashchange", route);
</script>
</body>
</html>
